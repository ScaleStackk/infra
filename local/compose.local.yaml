name: questacase-local-processing

x-aws-environment: &aws-environment
  AWS_REGION: "${AWS_REGION:-ap-south-2}"
  AWS_DEFAULT_REGION: "${AWS_REGION:-ap-south-2}"
  AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID:?Set AWS_ACCESS_KEY_ID in infra/local/.env}"
  AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY:?Set AWS_SECRET_ACCESS_KEY in infra/local/.env}"
  AWS_SESSION_TOKEN: "${AWS_SESSION_TOKEN:-}"

services:
  kafka:
    build:
      context: ../../msg_queue
    image: questacase-kafka:local
    restart: unless-stopped
    environment:
      CLUSTER_ID: "${KAFKA_CLUSTER_ID:-4L6g3nShT-eMCtK--X86sw}"
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_LISTENERS: CONTROLLER://:9093,INTERNAL://:19092,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_NUM_PARTITIONS: "8"
      KAFKA_DEFAULT_REPLICATION_FACTOR: "1"
      KAFKA_MIN_INSYNC_REPLICAS: "1"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
    ports:
      - 127.0.0.1:9092:9092
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "bash", "-ec", "</dev/tcp/127.0.0.1/19092"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 12
    networks: [questacase]

  inference:
    build:
      context: ../../inference/runtime
      args:
        OLLAMA_VERSION: "${OLLAMA_VERSION:-0.40.15}"
        OLLAMA_MODEL: "${OLLAMA_MODEL:-qwen3:4b}"
    image: questacase-inference:local
    restart: unless-stopped
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_CONTEXT_LENGTH: "${OLLAMA_CONTEXT_LENGTH:-16384}"
      OLLAMA_NUM_PARALLEL: "${OLLAMA_NUM_PARALLEL:-1}"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_KEEP_ALIVE: "${OLLAMA_KEEP_ALIVE:-24h}"
    ports:
      - 127.0.0.1:11434:11434
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 10s
      start_period: 45s
      retries: 12
    mem_limit: "${INFERENCE_MEMORY_LIMIT:-8g}"
    cpus: "${INFERENCE_CPU_LIMIT:-4.0}"
    networks: [questacase]

  inference-lb:
    build:
      context: ../../inference/load_balancer
    image: questacase-inference-lb:local
    restart: unless-stopped
    environment:
      INFERENCE_NODES: inference:11434
      INFERENCE_MAX_CONNECTIONS: "${INFERENCE_MAX_CONNECTIONS:-1}"
    ports:
      - 127.0.0.1:11435:11434
      - 127.0.0.1:8404:8404
    depends_on:
      inference:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "haproxy", "-c", "-f", "/tmp/questacase-haproxy/haproxy.cfg"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 12
    networks: [questacase]

  embedding-api:
    build:
      context: ../../embed_worker
    image: questacase-embedding-worker:local
    restart: unless-stopped
    entrypoint: ["python", "/app/embedding_server.py"]
    environment:
      PORT: "8081"
      EMBEDDING_API_KEY: "${EMBEDDING_API_KEY:?Set EMBEDDING_API_KEY in infra/local/.env}"
      OMP_NUM_THREADS: "${EMBEDDING_THREADS:-2}"
    ports:
      - 127.0.0.1:8081:8081
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      start_period: 45s
      retries: 12
    networks: [questacase]

  embedding-worker-volume-init:
    image: questacase-embedding-worker:local
    user: "0:0"
    entrypoint: ["sh", "-ec"]
    command: ["chown -R 10001:10001 /data/jobs"]
    restart: "no"
    volumes:
      - embedding_worker_jobs:/data/jobs

  kg-worker:
    build:
      context: ../../kg_worker
    image: questacase-kg-worker:local
    restart: unless-stopped
    entrypoint: ["python", "/app/queue_worker.py"]
    environment:
      <<: *aws-environment
      KAFKA_BROKERS: kafka:19092
      KAFKA_UPLOAD_TOPIC: judgment.uploaded
      KAFKA_CONSUMER_GROUP: questacase-kg-workers-local
      KAFKA_STATUS_TOPIC: processing.status
      KAFKA_FAILED_TOPIC: processing.failed
      WORKER_MAX_ATTEMPTS: "${WORKER_MAX_ATTEMPTS:-3}"
      WORKER_DATA_DIR: /data/jobs
      KEEP_JOB_FILES: "${KEEP_JOB_FILES:-false}"
      KG_MODEL: "${OLLAMA_MODEL:-qwen3:4b}"
      KG_NUM_PREDICT: "${KG_NUM_PREDICT:-3000}"
      KG_NUM_CTX: "${OLLAMA_CONTEXT_LENGTH:-16384}"
      KG_REQUEST_TIMEOUT: "${KG_REQUEST_TIMEOUT:-1800}"
      OLLAMA_URL: http://inference-lb:11434/api/generate
      NEO4J_URL: "${NEO4J_URL:?Set the AWS Neo4j URL in infra/local/.env}"
      NEO4J_DATABASE: "${NEO4J_DATABASE:-neo4j}"
      NEO4J_USERNAME: "${NEO4J_USERNAME:-neo4j}"
      NEO4J_PASSWORD: "${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in infra/local/.env}"
    volumes:
      - kg_worker_jobs:/data/jobs
    depends_on:
      kafka:
        condition: service_healthy
      inference-lb:
        condition: service_healthy
    networks: [questacase]

  embedding-worker:
    build:
      context: ../../embed_worker
    image: questacase-embedding-worker:local
    restart: unless-stopped
    entrypoint: ["python", "/app/queue_worker.py"]
    environment:
      <<: *aws-environment
      KAFKA_BROKERS: kafka:19092
      KAFKA_UPLOAD_TOPIC: judgment.uploaded
      KAFKA_CONSUMER_GROUP: questacase-embedding-workers-local
      KAFKA_STATUS_TOPIC: processing.status
      KAFKA_FAILED_TOPIC: processing.failed
      WORKER_MAX_ATTEMPTS: "${WORKER_MAX_ATTEMPTS:-3}"
      WORKER_DATA_DIR: /data/jobs
      KEEP_JOB_FILES: "${KEEP_JOB_FILES:-false}"
      OMP_NUM_THREADS: "${EMBEDDING_THREADS:-2}"
      QDRANT_URL: "${QDRANT_URL:?Set the AWS Qdrant URL in infra/local/.env}"
      QDRANT_COLLECTION: "${QDRANT_COLLECTION:-judgment_chunks}"
      QDRANT_API_KEY: "${QDRANT_WRITE_API_KEY:?Set QDRANT_WRITE_API_KEY in infra/local/.env}"
    volumes:
      - embedding_worker_jobs:/data/jobs
    depends_on:
      kafka:
        condition: service_healthy
      embedding-worker-volume-init:
        condition: service_completed_successfully
    networks: [questacase]

  webapi:
    build:
      context: ../../webapi
    image: questacase-webapi:local
    restart: unless-stopped
    environment:
      <<: *aws-environment
      PORT: "8080"
      API_BASE_PATH: api/v1
      API_ALLOWED_ORIGINS: http://localhost:3000
      S3_BUCKET: "${S3_BUCKET:?Set S3_BUCKET in infra/local/.env}"
      S3_PREFIX: "${S3_PREFIX:-judgments}"
      S3_PRESIGN_SECONDS: "${S3_PRESIGN_SECONDS:-300}"
      S3_SERVER_SIDE_ENCRYPTION: "${S3_SERVER_SIDE_ENCRYPTION:-AES256}"
      MAX_PDF_BYTES: "${MAX_PDF_BYTES:-52428800}"
      KAFKA_BROKERS: kafka:19092
      KAFKA_CLIENT_ID: questacase-webapi-local
      KAFKA_UPLOAD_TOPIC: judgment.uploaded
      EMBEDDING_API_URL: http://embedding-api:8081/embed
      EMBEDDING_API_KEY: "${EMBEDDING_API_KEY:?Set EMBEDDING_API_KEY in infra/local/.env}"
      EMBEDDING_MODEL: BAAI/bge-small-en-v1.5
      QDRANT_URL: "${QDRANT_URL:?Set the AWS Qdrant URL in infra/local/.env}"
      QDRANT_API_KEY: "${QDRANT_READ_API_KEY:?Set QDRANT_READ_API_KEY in infra/local/.env}"
      QDRANT_COLLECTION: "${QDRANT_COLLECTION:-judgment_chunks}"
      QDRANT_RESULT_LIMIT: "${QDRANT_RESULT_LIMIT:-8}"
      NEO4J_URL: "${NEO4J_URL:?Set the AWS Neo4j URL in infra/local/.env}"
      NEO4J_USERNAME: "${NEO4J_USERNAME:-neo4j}"
      NEO4J_PASSWORD: "${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in infra/local/.env}"
      NEO4J_DATABASE: "${NEO4J_DATABASE:-neo4j}"
      NEO4J_RESULT_LIMIT: "${NEO4J_RESULT_LIMIT:-30}"
      NEO4J_REQUIRED: "${NEO4J_REQUIRED:-true}"
      INFERENCE_API_URL: http://inference-lb:11434
      INFERENCE_MODEL: "${OLLAMA_MODEL:-qwen3:4b}"
      INFERENCE_NUM_PREDICT: "${INFERENCE_NUM_PREDICT:-600}"
      MAX_CONTEXT_CHARACTERS: "${MAX_CONTEXT_CHARACTERS:-24000}"
      REQUEST_TIMEOUT_MS: "${REQUEST_TIMEOUT_MS:-300000}"
    ports:
      - 127.0.0.1:8080:8080
    depends_on:
      kafka:
        condition: service_healthy
      embedding-api:
        condition: service_healthy
      inference-lb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/api/v1/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 12
    networks: [questacase]

  webapp:
    image: node:22-alpine
    restart: unless-stopped
    init: true
    working_dir: /app
    command:
      - sh
      - -ec
      - >-
        npm ci --ignore-scripts --no-audit --no-fund &&
        npm run dev -- --hostname 0.0.0.0
    environment:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_BACKEND_URL: http://localhost:8080/api/v1
    ports:
      - 127.0.0.1:3000:3000
    volumes:
      - ../../webapp:/app:ro
      - webapp_node_modules:/app/node_modules
      - webapp_next:/app/.next
    depends_on:
      webapi:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 45s
      retries: 12
    networks: [questacase]

networks:
  questacase:
    name: questacase-local

volumes:
  kafka_data:
  kg_worker_jobs:
  embedding_worker_jobs:
  webapp_node_modules:
  webapp_next:
