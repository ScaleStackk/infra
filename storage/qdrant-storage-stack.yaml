AWSTemplateFormatVersion: "2010-09-09"
Description: QuestaCase Qdrant storage node with public dashboard/API access and retained EBS-backed Docker data.

Parameters:
  EnvironmentName:
    Type: String
    Default: demo
  VpcCidr:
    Type: String
    Default: 10.70.0.0/16
  PublicSubnetCidr:
    Type: String
    Default: 10.70.1.0/24
  AvailabilityZone:
    Type: String
    Default: ap-south-2b
    AllowedPattern: "^[a-z]{2}-[a-z]+-[0-9]+[a-z]$"
    Description: Availability Zone for the EC2 instance and retained EBS volume.
  PublicIngressCidr:
    Type: String
    Default: 0.0.0.0/0
    AllowedPattern: ^(?:\d{1,3}\.){3}\d{1,3}/(?:[0-9]|[12][0-9]|3[0-2])$
    Description: CIDR allowed to access the Qdrant dashboard, REST API and gRPC. Use your public IP with /32 whenever possible.
  InstanceType:
    Type: String
    Default: t3.medium
  RootVolumeSize:
    Type: Number
    Default: 30
    MinValue: 20
  DataVolumeSize:
    Type: Number
    Default: 50
    MinValue: 50
  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ecs/optimized-ami/amazon-linux-2023/recommended/image_id
  DockerComposeVersion:
    Type: String
    Default: v5.6.1
  RepositoryUrl:
    Type: String
    Default: https://github.com/ScaleStackk/embed_storage.git
  RepositoryBranch:
    Type: String
    Default: main
  QdrantApiKey:
    Type: String
    NoEcho: true
    MinLength: 24
    MaxLength: 128
    AllowedPattern: ^[A-Za-z0-9._~!@#%^*+=-]+$
    ConstraintDescription: Use 24-128 characters without spaces, quotes, dollar signs, colons or slashes.
  QdrantReadOnlyApiKey:
    Type: String
    NoEcho: true
    MinLength: 24
    MaxLength: 128
    AllowedPattern: ^[A-Za-z0-9._~!@#%^*+=-]+$
    ConstraintDescription: Use a different 24-128 character key without spaces, quotes, dollar signs, colons or slashes.
  QdrantImage:
    Type: String
    Default: questacase-qdrant:1.20.0
  QdrantVersion:
    Type: String
    Default: v1.20.0

Resources:
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: Name
          Value: !Sub questacase-${EnvironmentName}-qdrant-vpc
        - Key: Project
          Value: QuestaCase

  InternetGateway:
    Type: AWS::EC2::InternetGateway

  GatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      InternetGatewayId: !Ref InternetGateway
      VpcId: !Ref Vpc

  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Ref PublicSubnetCidr
      MapPublicIpOnLaunch: true
      AvailabilityZone: !Ref AvailabilityZone
      Tags:
        - Key: Name
          Value: !Sub questacase-${EnvironmentName}-qdrant-public

  RouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc

  InternetRoute:
    Type: AWS::EC2::Route
    DependsOn: GatewayAttachment
    Properties:
      RouteTableId: !Ref RouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  SubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref RouteTable
      SubnetId: !Ref PublicSubnet

  StorageSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Public Qdrant dashboard REST and gRPC access for the controlled POC
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 6333
          ToPort: 6333
          CidrIp: !Ref PublicIngressCidr
          Description: Qdrant dashboard and REST API
        - IpProtocol: tcp
          FromPort: 6334
          ToPort: 6334
          CidrIp: !Ref PublicIngressCidr
          Description: Qdrant client gRPC
      SecurityGroupEgress:
        - IpProtocol: "-1"
          CidrIp: 0.0.0.0/0

  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/AmazonSSMManagedInstanceCore
      Tags:
        - Key: Project
          Value: QuestaCase

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref InstanceRole

  StorageInstance:
    Type: AWS::EC2::Instance
    DependsOn: InternetRoute
    Properties:
      ImageId: !Ref LatestAmiId
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !Ref InstanceProfile
      MetadataOptions:
        HttpEndpoint: enabled
        HttpTokens: required
        HttpPutResponseHopLimit: 2
      NetworkInterfaces:
        - AssociatePublicIpAddress: true
          DeleteOnTermination: true
          DeviceIndex: "0"
          GroupSet:
            - !Ref StorageSecurityGroup
          SubnetId: !Ref PublicSubnet
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            DeleteOnTermination: true
            Encrypted: true
            VolumeSize: !Ref RootVolumeSize
            VolumeType: gp3
      Tags:
        - Key: Name
          Value: !Sub questacase-${EnvironmentName}-qdrant
        - Key: Project
          Value: QuestaCase
      UserData:
        Fn::Base64: !Sub |
          #!/usr/bin/env bash
          set -Eeuo pipefail
          exec > >(tee /var/log/questacase-qdrant-bootstrap.log | logger -t questacase-qdrant -s 2>/dev/console) 2>&1

          # The ECS-optimized AL2023 image already includes curl-minimal, which
          # provides the curl command. Installing full curl conflicts with it.
          dnf install -y git xfsprogs
          systemctl disable --now ecs || true

          DATA_VOLUME_ID='${DataVolume}'
          DATA_VOLUME_SERIAL="$(printf '%s' "$DATA_VOLUME_ID" | tr -d '-')"
          BY_ID="/dev/disk/by-id/nvme-Amazon_Elastic_Block_Store_$DATA_VOLUME_SERIAL"
          DEVICE=""
          for attempt in {1..60}; do
            if [[ -e "$BY_ID" ]]; then
              DEVICE="$(readlink -f "$BY_ID")"
              break
            fi
            for candidate in /dev/xvdf /dev/sdf /dev/nvme1n1; do
              if [[ -b "$candidate" ]]; then
                DEVICE="$candidate"
                break 2
              fi
            done
            sleep 5
          done
          if [[ -z "$DEVICE" ]]; then
            echo "Retained EBS data volume did not appear." >&2
            exit 1
          fi

          systemctl stop docker || true
          FS_TYPE="$(blkid -s TYPE -o value "$DEVICE" || true)"
          if [[ -z "$FS_TYPE" ]]; then
            mkfs.xfs -f "$DEVICE"
            FS_TYPE=xfs
          fi
          FS_UUID="$(blkid -s UUID -o value "$DEVICE")"
          install -d -m 0711 /var/lib/docker
          if ! grep -q "UUID=$FS_UUID " /etc/fstab; then
            printf 'UUID=%s /var/lib/docker %s defaults,nofail 0 2\n' "$FS_UUID" "$FS_TYPE" >> /etc/fstab
          fi
          mount /var/lib/docker
          systemctl enable --now docker
          usermod -aG docker ec2-user

          install -d -m 0755 /usr/local/lib/docker/cli-plugins
          curl -fsSL "https://github.com/docker/compose/releases/download/${DockerComposeVersion}/docker-compose-linux-x86_64" \
            -o /usr/local/lib/docker/cli-plugins/docker-compose
          chmod 0755 /usr/local/lib/docker/cli-plugins/docker-compose

          install -d -m 0755 /opt/questacase
          git clone --depth 1 --branch '${RepositoryBranch}' '${RepositoryUrl}' /opt/questacase/embed-storage
          cd /opt/questacase/embed-storage

          cat >.env <<'ENVIRONMENT'
          DOCKER_PLATFORM=linux/amd64
          QDRANT_IMAGE=${QdrantImage}
          QDRANT_VERSION=${QdrantVersion}
          QDRANT_API_KEY=${QdrantApiKey}
          QDRANT_READ_ONLY_API_KEY=${QdrantReadOnlyApiKey}
          QDRANT_BIND_ADDRESS=0.0.0.0
          QDRANT_HTTP_PORT=6333
          QDRANT_GRPC_PORT=6334
          QDRANT_LOG_LEVEL=INFO
          QDRANT_MEMORY_LIMIT=2g
          QDRANT_CPU_LIMIT=2.0
          ENVIRONMENT
          chmod 0600 .env

          ./build.sh
          ./run.sh

  DataVolume:
    Type: AWS::EC2::Volume
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      AvailabilityZone: !GetAtt PublicSubnet.AvailabilityZone
      Encrypted: true
      Size: !Ref DataVolumeSize
      VolumeType: gp3
      Tags:
        - Key: Name
          Value: !Sub questacase-${EnvironmentName}-qdrant-data
        - Key: Project
          Value: QuestaCase

  DataVolumeAttachment:
    Type: AWS::EC2::VolumeAttachment
    Properties:
      Device: /dev/sdf
      InstanceId: !Ref StorageInstance
      VolumeId: !Ref DataVolume

Outputs:
  InstanceId:
    Value: !Ref StorageInstance
  PrivateIp:
    Value: !GetAtt StorageInstance.PrivateIp
  PublicIp:
    Value: !GetAtt StorageInstance.PublicIp
    Description: Changes after a stop/start cycle because this template does not allocate an Elastic IP.
  QdrantDashboardUrl:
    Value: !Sub http://${StorageInstance.PublicDnsName}:6333/dashboard
  QdrantRestUrl:
    Value: !Sub http://${StorageInstance.PublicDnsName}:6333
  QdrantGrpcEndpoint:
    Value: !Sub ${StorageInstance.PublicDnsName}:6334
  DataVolumeId:
    Value: !Ref DataVolume
    Description: Retained EBS volume containing Docker images and Qdrant named volumes.
  VpcId:
    Value: !Ref Vpc
  SecurityGroupId:
    Value: !Ref StorageSecurityGroup
  BootstrapLogCommand:
    Value: !Sub aws ssm start-session --target ${StorageInstance} --region ${AWS::Region}
